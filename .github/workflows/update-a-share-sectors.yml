name: Update A-share sector data

on:
  schedule:
    - cron: '30 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch latest sector data
        run: node scripts/update-a-share-sectors.mjs
      - name: Refresh chart fund index
        run: node scripts/update-technical-funds.mjs
      - name: Validate freshness and completeness
        run: npm run validate:data:a-share
      - name: Validate technical-fund projection
        run: npm run validate:data:technical-funds
      - name: Commit changed data
        run: |
          if git diff --quiet -- src/data/a-share-sectors.json src/data/technical-funds.json; then
            echo "No sector data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/a-share-sectors.json src/data/technical-funds.json
          git commit -m "chore: update A-share sector data"
          git push
