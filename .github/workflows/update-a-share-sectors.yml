name: Update A-share sector data

on:
  schedule:
    - cron: '30 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch latest sector data
        run: node scripts/update-a-share-sectors.mjs
      - name: Refresh chart fund index
        run: node scripts/update-technical-funds.mjs
      - name: Validate freshness and completeness
        run: npm run validate:data:a-share
      - name: Validate technical-fund projection
        run: npm run validate:data:technical-funds -- --market a-share
      - name: Commit changed data
        run: >-
          node scripts/commit-refreshed-data.mjs "chore: update A-share sector data" src/data/a-share-sectors.json src/data/technical-funds.json
