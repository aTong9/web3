name: Update cross-asset dashboard

on:
  schedule:
    - cron: '20 23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run update:cross-asset
      - run: npm run update:technical-events
      - run: npm run update:fund-transmission
      - name: Validate cross-asset dataset family
        run: npm run validate:data:cross-asset
      - name: Commit changed data
        run: >-
          node scripts/commit-refreshed-data.mjs "chore: update cross-asset dashboard" src/data/cross-asset.json src/data/market-home.json src/data/cross-asset-forecast-history.json src/data/technical-events.json src/data/asset-technical-signals.json src/data/fund-transmission.json
