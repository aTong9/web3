name: Update cross-asset dashboard

on:
  schedule:
    - cron: '20 23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run update:cross-asset
      - run: npm run update:technical-events
      - run: npm run update:fund-transmission
      - name: Commit changed data
        run: |
          if git diff --quiet -- src/data/cross-asset.json src/data/market-home.json src/data/cross-asset-forecast-history.json src/data/technical-events.json src/data/asset-technical-signals.json src/data/fund-transmission.json; then
            echo "No cross-asset changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cross-asset.json src/data/market-home.json src/data/cross-asset-forecast-history.json src/data/technical-events.json src/data/asset-technical-signals.json src/data/fund-transmission.json
          git commit -m "chore: update cross-asset dashboard"
          git push
