name: Update hot stocks

on:
  schedule:
    - cron: '20 10 * * 1-5'
    - cron: '30 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-hot-stocks
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Refresh A-share and US hot-stock rankings
        run: npm run update:hot-stocks
      - name: Refresh US mega-cap valuations
        run: npm run update:us-megacaps
      - name: Commit changed rankings
        run: |
          if git diff --quiet -- src/data/hot-stocks.json src/data/us-megacaps.json; then
            echo "No stock-data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/hot-stocks.json src/data/us-megacaps.json
          git commit -m "chore: update US stock rankings and valuations"
          git push
