name: Update hot stocks

on:
  schedule:
    - cron: '20 10 * * 1-5'
    - cron: '30 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Refresh A-share and US hot-stock rankings
        run: npm run update:hot-stocks
      - name: Refresh US mega-cap valuations
        run: npm run update:us-megacaps
      - name: Refresh US mega-cap OHLCV history
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: npm run update:us-stock-technicals
      - name: Refresh US mega-cap LEAPS market data
        if: ${{ vars.ENABLE_OPTION_MARKET == 'true' }}
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: npm run update:option-market
      - name: Validate core stock datasets
        run: npm run validate:data:hot-stocks
      - name: Validate option dataset when refreshed
        if: ${{ vars.ENABLE_OPTION_MARKET == 'true' }}
        run: npm run validate:data:option-market
      - name: Commit changed rankings
        run: >-
          node scripts/commit-refreshed-data.mjs "chore: update US stock rankings and valuations" src/data/hot-stocks.json src/data/us-megacaps.json src/data/us-stock-technical-signals.json src/data/option-market.json
