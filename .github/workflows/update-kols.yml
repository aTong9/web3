name: Update KOL monitor

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Fetch latest KOL content
        run: npm run update:kols
      - name: Validate KOL monitor
        run: npm run validate:data:kols
      - name: Commit changed data
        run: >-
          node scripts/commit-refreshed-data.mjs "chore: update KOL monitor" src/data/kol-monitor.json
