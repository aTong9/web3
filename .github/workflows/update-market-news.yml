name: Update global market news

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Fetch latest global market news
        run: npm run update:news
      - name: Validate market news
        run: npm run validate:data:news
      - name: Commit changed data
        run: >-
          node scripts/commit-refreshed-data.mjs "chore: update global market news" src/data/market-news.json
