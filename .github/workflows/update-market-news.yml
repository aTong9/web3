name: Update global market news

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Fetch latest global market news
        run: npm run update:news
      - name: Validate market news
        run: npm run validate:data:news
      - name: Commit changed data
        run: |
          if git diff --quiet -- src/data/market-news.json; then
            echo "No market news changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/market-news.json
          git commit -m "chore: update global market news"
          git push
