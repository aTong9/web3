name: Update Norway sovereign fund

on:
  schedule:
    - cron: '15 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Refresh official NBIM report and holdings snapshot
        run: npm run update:norway-fund
      - name: Validate report structure and holdings consistency
        run: npm run validate:data:norway-fund
      - name: Commit changed snapshot
        run: >-
          node scripts/commit-refreshed-data.mjs "chore: update Norway sovereign fund snapshot" src/data/norway-fund-snapshot.json
