name: Update US fund data

on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch latest fund data
        run: node scripts/update-us-funds.mjs
      - name: Refresh chart fund index
        run: node scripts/update-technical-funds.mjs
      - name: Commit changed data
        run: |
          if git diff --quiet -- src/data/us-funds.json src/data/technical-funds.json; then
            echo "No fund data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/us-funds.json src/data/technical-funds.json
          git commit -m "chore: update US fund data"
          git push
