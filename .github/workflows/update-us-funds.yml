name: Update US fund data

on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch latest fund data
        run: node scripts/update-us-funds.mjs
      - name: Refresh chart fund index
        run: node scripts/update-technical-funds.mjs
      - name: Validate freshness and completeness
        run: npm run validate:data:us-funds
      - name: Validate technical-fund projection
        run: npm run validate:data:technical-funds -- --market us-related
      - name: Commit changed data
        run: >-
          node scripts/commit-refreshed-data.mjs "chore: update US fund data" src/data/us-funds.json src/data/technical-funds.json
