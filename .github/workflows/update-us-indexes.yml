name: Update US index research data

on:
  schedule:
    - cron: '30 2 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Refresh QQQ, SPY, GLD and Bitcoin market histories
        run: npm run update:us-indexes
      - name: Validate research calculations
        run: npm run test:trading
      - name: Validate freshness and completeness
        run: npm run validate:data:us-indexes
      - name: Commit changed snapshot
        run: >-
          node scripts/commit-refreshed-data.mjs "chore: update US index research data" src/data/us-index-research.json src/data/us-index-daily.json
