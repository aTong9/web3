name: Update US index research data

on:
  schedule:
    - cron: '30 2 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Refresh QQQ, SPY, GLD and Bitcoin market histories
        run: npm run update:us-indexes
      - name: Validate research calculations
        run: npm run test:trading
      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- src/data/us-index-research.json; then
            echo "No US index data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/us-index-research.json
          git commit -m "chore: update US index research data"
          git push
